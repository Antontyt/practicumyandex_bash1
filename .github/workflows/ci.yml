name: CI

on:
  push:
                    
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Check line endings (CRLF is not allowed in .sh)
        run: |
          if git ls-files '*.sh' | xargs file | grep -q CRLF; then
            echo "CRLF found in .sh files"
            exit 1
          fi

      - name: Syntax check (bash -n)
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          shopt -s globstar nullglob
          files=(bash_scripts/**/*.sh bash_scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts yet, skipping"
          else
            shellcheck "${files[@]}"
          fi

      - name: Bats tests
        run: |
          shopt -s nullglob
          tests=(bash_scripts/tests/*.bats)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No tests yet, skipping"
          else
            bats "${tests[@]}"
          fi
